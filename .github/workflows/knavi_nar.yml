name: knavi_nar
# 地方：競馬ナビを外部指数の平均に混ぜてよいか（KN）。集計値だけを analysis へ
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/knavi_nar.py', '.github/workflows/knavi_nar.yml']
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: nardata
          key: nar-data-none
          restore-keys: nar-data-
      - uses: actions/cache/restore@v4
        with:
          path: oddsdata
          key: nar-odds-none
          restore-keys: nar-odds-
      - uses: actions/cache/restore@v4
        with:
          path: extdata
          key: ext-data-none
          restore-keys: ext-data-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q numpy pandas scikit-learn scipy
      - run: set -o pipefail; python3 scripts/knavi_nar.py nardata oddsdata extdata 2>&1 | grep -v Warning | tee knavi_nar.txt
      - if: always()
        run: |
          mkdir -p an && cp knavi_nar.txt an/ 2>/dev/null || true
          git fetch -q origin analysis && for f in venue_time ext_compare pm_check pm_tune pm_jra jra_model bias_jra bias_nar ext_jra ext_daily; do git show origin/analysis:$f.txt > an/$f.txt 2>/dev/null || true; done
          cd an && git init -q && git checkout -q -b analysis
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com add -A
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com commit -q -m a
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" analysis
