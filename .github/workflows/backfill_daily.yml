name: backfill_daily
# デイリー うま屋のスピード指数・印（中央の過去分）。3秒間隔・1回2400ページまで。データはキャッシュだけ、件数だけ daily-status へ
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/backfill_daily.py', 'keiba/daily.py', '.github/workflows/backfill_daily.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: backfill_daily
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q origin data && mkdir -p jradata && git --work-tree=jradata checkout origin/data -- races && git reset -q
      - uses: actions/cache/restore@v4
        with:
          path: dailydata
          key: daily-data-none
          restore-keys: daily-data-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q beautifulsoup4 lxml
      - run: python3 scripts/backfill_daily.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: dailydata
          key: daily-data-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 件数だけ記録し、残りがあれば次の回を起動
        if: always()
        run: |
          mkdir -p st && cp dailydata/status.json st/ 2>/dev/null || echo '{}' > st/status.json; cat st/status.json
          L=$(python3 -c "import json;d=json.load(open('st/status.json'));print(d.get('left',0) if d.get('fetched',0)>0 and not d.get('refused') else 0)")
          cd st && git init -q && git checkout -q -b daily-status
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com add -A
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com commit -q -m s
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" daily-status
          if [ "$L" -gt 0 ]; then
            curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/backfill_daily.yml/dispatches -d '{"ref":"main"}' -w "%{http_code}\n"
          fi
