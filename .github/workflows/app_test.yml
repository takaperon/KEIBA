name: app_test
# 過去の日付でアプリ用データを作って確認する（本番の site / app-data には触らない。結果は暗号化して app-test ブランチへ）
on:
  workflow_dispatch:
    inputs:
      day: { description: 'YYYYMMDD', required: true }
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with: { path: nardata, key: nar-data-none, restore-keys: nar-data- }
      - uses: actions/cache/restore@v4
        with: { path: oddsdata, key: nar-odds-none, restore-keys: nar-odds- }
      - uses: actions/cache/restore@v4
        with: { path: nokendata, key: noken-data-none, restore-keys: noken-data- }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q numpy pandas scikit-learn lightgbm beautifulsoup4 lxml cryptography
      - run: APP_DAY=${{ inputs.day }} python3 scripts/app_data.py nardata
      - run: |
          mkdir -p ad && bash scripts/seal.sh appout/app.json ad/app.sealed
          cd ad && git init -q && git checkout -q -b app-test
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com add -A
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com commit -q -m t
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" app-test
