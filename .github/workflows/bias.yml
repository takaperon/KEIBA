name: bias
# 前残り・差し・内枠・外枠の傾向と開催日目の検証。集計値だけを analysis ブランチへ
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/bias.py', '.github/workflows/bias.yml']
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q origin data && mkdir -p jradata && git --work-tree=jradata checkout origin/data -- races && git reset -q
      - uses: actions/cache/restore@v4
        with:
          path: nardata
          key: nar-data-none
          restore-keys: nar-data-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q numpy pandas scikit-learn lightgbm
      - run: set -o pipefail; python3 scripts/bias.py jra 2>&1 | grep -v Warning | tee bias_jra.txt
      - if: always()
        run: set -o pipefail; python3 scripts/bias.py nar nardata 2>&1 | grep -v Warning | tee bias_nar.txt
      - if: always()
        run: |
          mkdir -p an && cp bias_jra.txt bias_nar.txt an/ 2>/dev/null || true
          git fetch -q origin analysis && for f in venue_time ext_compare pm_check pm_tune pm_jra jra_model; do git show origin/analysis:$f.txt > an/$f.txt 2>/dev/null || true; done
          cd an && git init -q && git checkout -q -b analysis
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com add -A
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com commit -q -m a
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" analysis
