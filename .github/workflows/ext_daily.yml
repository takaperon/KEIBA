name: ext_daily
# 中央：デイリーSP・本紙印＋HORSE の検証（DY）。手動。集計値だけを analysis へ
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q origin data && mkdir -p jradata && git --work-tree=jradata checkout origin/data -- races && git reset -q
      - uses: actions/cache/restore@v4
        with:
          path: dailydata
          key: daily-data-none
          restore-keys: daily-data-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q numpy pandas scikit-learn lightgbm
      - run: set -o pipefail; python3 scripts/ext_daily.py 2>&1 | grep -v Warning | tee ext_daily.txt
      - if: always()
        run: |
          mkdir -p an && cp ext_daily.txt an/ 2>/dev/null || true
          git fetch -q origin analysis && for f in venue_time ext_compare pm_check pm_tune pm_jra jra_model bias_jra bias_nar ext_jra; do git show origin/analysis:$f.txt > an/$f.txt 2>/dev/null || true; done
          cd an && git init -q && git checkout -q -b analysis
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com add -A
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com commit -q -m a
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" analysis
