name: roi
# 券種ごとの回収率（RO）。集計値だけを analysis へ
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/roi.py', 'scripts/_nar_frame.py', '.github/workflows/roi.yml']
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q origin data && mkdir -p jradata && git --work-tree=jradata checkout origin/data -- races && git reset -q
      - uses: actions/cache/restore@v4
        with:
          path: peddata
          key: ped-data-none
          restore-keys: ped-data-
      - uses: actions/cache/restore@v4
        with:
          path: dailydata
          key: daily-data-none
          restore-keys: daily-data-
      - uses: actions/cache/restore@v4
        with:
          path: nardata
          key: nar-data-none
          restore-keys: nar-data-
      - uses: actions/cache/restore@v4
        with:
          path: extdata
          key: ext-data-none
          restore-keys: ext-data-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q numpy pandas scikit-learn lightgbm
      - run: set -o pipefail; python3 scripts/roi.py jra 2>&1 | grep -v Warning | tee roi_jra.txt
      - if: always()
        run: set -o pipefail; python3 scripts/roi.py nar nardata extdata 2>&1 | grep -v Warning | tee roi_nar.txt
      - if: always()
        run: |
          mkdir -p an && cp roi_jra.txt roi_nar.txt an/ 2>/dev/null || true
          git fetch -q origin analysis && for f in $(git ls-tree --name-only origin/analysis); do [ -f an/$f ] || git show origin/analysis:$f > an/$f 2>/dev/null || true; done
          cd an && git init -q && git checkout -q -b analysis
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com add -A
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com commit -q -m a
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" analysis
