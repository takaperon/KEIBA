name: backfill_nar
# 地方（NAR）過去2年分を netkeiba から3秒間隔で取得。
# 状態（件数だけ）は nar-status ブランチへ。公開リポジトリの間はデータをブランチに置かず Actions キャッシュにだけ保存。非公開になったら nar-data ブランチへ移す。
on:
  schedule:
    - cron: '40 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/backfill_nar.py', 'keiba/nk.py', '.github/workflows/backfill_nar.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: backfill_nar
  cancel-in-progress: true
jobs:
  nar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: nardata
          key: nar-data-${{ github.run_id }}
          restore-keys: nar-data-
      - name: private?
        id: vis
        run: |
          p=$(curl -s -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/${{ github.repository }} | python3 -c "import json,sys;print(str(json.load(sys.stdin).get('private')).lower())")
          echo "private=$p" >> $GITHUB_OUTPUT; echo "private=$p"
      - name: restore from branch if private
        if: steps.vis.outputs.private == 'true'
        run: |
          if git fetch origin nar-data:nar-data 2>/dev/null && [ ! -f nardata/state.json ]; then git worktree add nd nar-data && mkdir -p nardata && cp -r nd/* nardata/; fi
      - run: pip install -q beautifulsoup4 lxml
      - name: run
        run: |
          M=320
          python3 scripts/backfill_nar.py --data nardata --max-minutes $M 2>&1 | tee run.log
      - name: coverage (counts only)
        if: always()
        run: |
          python3 scripts/nar_coverage.py nardata > cov.txt 2>&1 || true
          mkdir -p st && cp cov.txt st/ && tail -3 run.log > st/last_run.txt 2>/dev/null; date -u > st/at.txt
          cd st && git init -q && git checkout -q -b nar-status
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com add -A
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com commit -q -m status
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" nar-status
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: nardata
          key: nar-data-${{ github.run_id }}-${{ github.run_attempt }}
      - name: push to private branch (only when the repo is private)
        if: always() && steps.vis.outputs.private == 'true'
        run: |
          rm -rf nd2 && mkdir nd2 && cp -r nardata/* nd2/ && cd nd2 && git init -q && git checkout -q -b nar-data
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com add -A
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com commit -q -m "nar data"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" nar-data
      - name: chain next run until done（GitHub の定時実行は遅れがちなので自分で次を起動）
        if: success() && hashFiles('nardata/DONE') == '' && hashFiles('nardata/STOPPED') == ''
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/backfill_nar.yml/dispatches -d '{"ref":"main"}' -w "%{http_code}\n"
