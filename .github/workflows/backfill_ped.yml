name: backfill_ped
# 血統（父・母・母父）の過去分を netkeiba の馬柱ページから集める（キャッシュに保存。件数だけ ped-status ブランチへ）
on:
  schedule:
    - cron: '0 13 * * *'   # 毎晩 22:00 JST（レースのデータ取得と重ならない時間）
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: backfill_ped
  cancel-in-progress: false
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: nardata
          key: nar-data-none
          restore-keys: nar-data-
      - uses: actions/cache/restore@v4
        with:
          path: peddata
          key: ped-data-${{ github.run_id }}
          restore-keys: ped-data-
      - run: git fetch -q origin data && mkdir -p jradata && git --work-tree=jradata checkout origin/data -- races && git reset -q
      - run: pip install -q beautifulsoup4 lxml
      - name: collect (JST 21:30〜翌7:30 の間だけ。定時実行が遅れて昼にずれ込んだら、レースのデータ取得と重ならないよう止める)
        run: |
          set -o pipefail
          M=$(python3 -c "
          import datetime as d
          n=d.datetime.utcnow()+d.timedelta(hours=9)
          end=n.replace(hour=7,minute=30,second=0)
          if n.hour>=8 and (n.hour,n.minute)<(21,30): print(0)
          else:
            end = end if n<end else end+d.timedelta(days=1)
            print(min(300,int((end-n).total_seconds()/60)))")
          echo "使える時間 $M 分"
          if [ "$M" -lt 20 ]; then echo "昼間なので取らない"; exit 0; fi
          python3 scripts/backfill_ped.py --max-minutes $M --interval 10 --max-pages 1500 2>&1 | tail -40
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: peddata
          key: ped-data-${{ github.run_id }}-${{ github.run_attempt }}
      - name: status (counts only)
        if: always()
        run: |
          mkdir -p ps && python3 -c "import json;s=json.load(open('peddata/state.json'));s.pop('empty',None);json.dump(s,open('ps/state.json','w'))" || echo '{}' > ps/state.json
          cd ps && git init -q && git checkout -q -b ped-status
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com add -A
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com commit -q -m s
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ped-status
      - name: 朝になったら地方・中央のオッズ記録へバトンを渡す
        if: always()
        run: |
          H=$(TZ=Asia/Tokyo date +%H)
          if [ $H -ge 6 ] && [ $H -lt 12 ]; then
            for w in collect_nar collect_jra; do
              curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/${{ github.repository }}/actions/workflows/$w.yml/dispatches -d '{"ref":"main"}' -w "$w %{http_code}\n"
            done
          fi
