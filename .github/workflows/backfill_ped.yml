name: backfill_ped
# 血統（父・母・母父）の過去分を netkeiba の馬柱ページから集める（キャッシュに保存。件数だけ ped-status ブランチへ）
on:
  schedule:
    - cron: '10 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/backfill_ped.py', '.github/workflows/backfill_ped.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: backfill_ped
  cancel-in-progress: false
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: nardata
          key: nar-data-none
          restore-keys: nar-data-
      - uses: actions/cache/restore@v4
        with:
          path: peddata
          key: ped-data-${{ github.run_id }}
          restore-keys: ped-data-
      - run: git fetch -q origin data && mkdir -p jradata && git --work-tree=jradata checkout origin/data -- races && git reset -q
      - run: pip install -q beautifulsoup4 lxml
      - run: python3 scripts/backfill_ped.py --max-minutes 300 2>&1 | tail -40
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: peddata
          key: ped-data-${{ github.run_id }}-${{ github.run_attempt }}
      - name: status (counts only)
        if: always()
        run: |
          mkdir -p ps && python3 -c "import json;s=json.load(open('peddata/state.json'));s.pop('empty',None);json.dump(s,open('ps/state.json','w'))" || echo '{}' > ps/state.json
          cd ps && git init -q && git checkout -q -b ped-status
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com add -A
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com commit -q -m s
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ped-status
      - name: chain
        if: success() && hashFiles('peddata/DONE') == ''
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/backfill_ped.yml/dispatches -d '{"ref":"main"}' -w "%{http_code}\n"
