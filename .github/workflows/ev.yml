name: ev
# 地方の単勝：指数が人気より高く見ている馬だけ買う（EV）。集計値だけを analysis へ
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/ev.py', '.github/workflows/ev.yml']
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: nardata
          key: nar-data-none
          restore-keys: nar-data-
      - uses: actions/cache/restore@v4
        with:
          path: extdata
          key: ext-data-none
          restore-keys: ext-data-
      - uses: actions/cache/restore@v4
        with:
          path: oddsdata
          key: nar-odds-none
          restore-keys: nar-odds-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q numpy pandas scikit-learn lightgbm
      - run: set -o pipefail; python3 scripts/ev.py nar nardata extdata oddsdata 2>&1 | grep -v Warning | tee ev.txt
      - if: always()
        run: |
          mkdir -p an && cp ev.txt an/ 2>/dev/null || true
          git fetch -q origin analysis && for f in $(git ls-tree --name-only origin/analysis); do [ -f an/$f ] || git show origin/analysis:$f > an/$f 2>/dev/null || true; done
          cd an && git init -q && git checkout -q -b analysis
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com add -A
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com commit -q -m a
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" analysis
