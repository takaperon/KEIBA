name: app_data
# アプリ用の当日データ（中央・地方）を作り、暗号化して app-data ブランチへ置く
on:
  schedule:
    - cron: '20 0 * * *'
    - cron: '20 3 * * *'
    - cron: '20 6 * * *'
    - cron: '20 9 * * *'
    - cron: '20 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/app_data.py', 'scripts/app_day.txt', 'site_src/**', 'keiba/nk.py', 'keiba/noken.py', 'scripts/build_ped_data.py', '.github/workflows/app_data.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: app_data
  cancel-in-progress: true
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: nardata
          key: nar-data-none
          restore-keys: nar-data-
      - uses: actions/cache/restore@v4
        with:
          path: oddsdata
          key: nar-odds-none
          restore-keys: nar-odds-
      - uses: actions/cache/restore@v4
        with:
          path: nokendata
          key: noken-data-none
          restore-keys: noken-data-
      - uses: actions/cache/restore@v4
        with:
          path: extdata
          key: ext-data-none
          restore-keys: ext-data-
      - uses: actions/cache/restore@v4
        with:
          path: peddata
          key: ped-data-none
          restore-keys: ped-data-
      - run: git fetch -q origin data && mkdir -p jradata && git --work-tree=jradata checkout origin/data -- races && git reset -q
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q numpy pandas scikit-learn lightgbm beautifulsoup4 lxml cryptography
      - run: python3 scripts/app_data.py nardata
      - run: python3 scripts/build_ped_data.py || echo "血統データ作成に失敗"
      - name: seal and push
        run: |
          mkdir -p ad && bash scripts/seal.sh appout/app.json ad/app.sealed && date -u > ad/built_at.txt
          cd ad && git init -q && git checkout -q -b app-data
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com add -A
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com commit -q -m app-data
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" app-data
      - name: build live site (Cloudflare Pages の site ブランチ)
        run: |
          rm -rf st && mkdir st && cp -r site_src/. st/ && python3 keiba/seal2.py appout/app.json st/data.json
          for k in chiho chuo; do [ -f appout/ped_$k.json.gz ] && python3 keiba/seal2.py appout/ped_$k.json.gz st/ped_$k.json; done; ls -la st
          cd st && git init -q && git checkout -q -b site
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com add -A
          git -c user.name=keiba-bot -c user.email=keiba-bot@users.noreply.github.com commit -q -m site
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" site
      - name: 土日・祝日は中央の締切前オッズ記録が動いているか確認し、止まっていれば起動（定時実行が来ないことがあるため）
        if: always()
        run: |
          H=$(TZ=Asia/Tokyo date +%H)
          C=$(python3 -c "import json;print(len(json.load(open('appout/app.json'))['modes'].get('chuo') or []))" 2>/dev/null || echo 0)
          if [ "$C" != "0" ] && [ $H -ge 8 ] && [ $H -lt 16 ]; then
            N=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/collect_jra.yml/runs?status=in_progress" | python3 -c "import json,sys;print(json.load(sys.stdin).get('total_count',0))")
            Q=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/collect_jra.yml/runs?status=queued" | python3 -c "import json,sys;print(json.load(sys.stdin).get('total_count',0))")
            echo "collect_jra running=$N queued=$Q"
            if [ "$N" = "0" ] && [ "$Q" = "0" ]; then
              curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/${{ github.repository }}/actions/workflows/collect_jra.yml/dispatches -d '{"ref":"main"}' -w "%{http_code}\n"
            fi
          fi
