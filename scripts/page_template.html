<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KEIBA 中央競馬</title>
<style>
:root{--bg:#0b0e14;--card:#141a24;--line:#232c3b;--tx:#e8ecf3;--mut:#8a96a8;--neo:#2ef2c8;--hot:#ff4d8d;--warn:#ffb020}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(11,14,20,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 14px 8px}
h1{margin:0;font-size:19px;letter-spacing:.12em}h1 b{color:var(--neo)}
.sub{color:var(--mut);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.tab{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:600}
.tab.on{border-color:var(--neo);color:var(--neo);box-shadow:0 0 10px rgba(46,242,200,.25)}
.rn{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.rn::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.rn button{flex:0 0 auto;width:42px;padding:6px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-weight:700}
.rn button.done{opacity:.4}.rn button.on{background:var(--neo);color:#04211b;border-color:var(--neo)}
main{padding:12px 12px 40px}
.warn{border:1px solid rgba(255,176,32,.4);background:rgba(255,176,32,.08);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.rh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rt{font-size:18px;font-weight:800}.gr{color:var(--hot);font-size:13px;margin-left:6px}
.meta{color:var(--mut);font-size:12.5px;margin-top:4px}
.time{font-weight:700;color:var(--neo);white-space:nowrap}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
th{color:var(--mut);font-weight:500;font-size:11px;text-align:left;padding:4px 3px;border-bottom:1px solid var(--line)}
td{padding:7px 3px;border-bottom:1px solid var(--line);vertical-align:middle}
.num{width:30px;text-align:center}.w{display:inline-block;width:24px;height:24px;line-height:24px;border-radius:6px;font-weight:800;font-size:13px;text-align:center}
.nm{font-weight:700}.jk{color:var(--mut);font-size:11.5px}
.r{text-align:right;white-space:nowrap}.pop{color:var(--mut);font-size:11px}
.idx{font-weight:800}.top1{color:var(--neo)}.top3{color:#9be7d6}
tr.gap{background:linear-gradient(90deg,rgba(255,77,141,.16),transparent)}
.star{color:var(--hot);font-weight:800}
.pick{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.pick:last-child{border:0}
.lg{color:var(--mut);font-size:11.5px;margin-top:8px}
.bar{height:4px;border-radius:2px;background:var(--neo);opacity:.7;margin-top:3px}
</style></head><body>
<header><h1>KEIBA <b>中央</b></h1><div class="sub" id="sub"></div><div class="tabs" id="tabs"></div><div class="rn" id="rn"></div></header>
<main id="main"></main>
<script>
const D=/*DATA*/null;
const WC=['','#f2f2f2','#222','#e0303b','#2f6fe0','#f4d03f','#2fae5a','#ff8c2e','#ff6fb1'];
const WT=['','#111','#fff','#fff','#fff','#111','#fff','#111','#111'];
let place=null,rno=null;
const places=[...new Set(D.races.map(r=>r.place_name))];
const now=()=>{const t=new Date(Date.now()+9*3600e3);return t.toISOString().slice(11,16)};
const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10).replace(/-/g,'');
const done=r=>today>D.date||(today===D.date&&r.post_time<now());
function init(){
  document.getElementById('sub').textContent=`${D.date.slice(0,4)}/${D.date.slice(4,6)}/${D.date.slice(6)}　オッズ取得 ${D.fetched_at.slice(11)} 時点`;
  try{place=localStorage.getItem('kp')}catch(e){}
  if(!places.includes(place))place=places[0];
  const nx=D.races.find(r=>r.place_name===place&&!done(r));rno=nx?nx.rno:1;
  render();
}
function render(){
  document.getElementById('tabs').innerHTML=['注目',...places].map(p=>`<button class="tab ${p===place?'on':''}" onclick="setP('${p}')">${p}</button>`).join('');
  const rn=document.getElementById('rn');
  if(place==='注目'){rn.innerHTML='';document.getElementById('main').innerHTML=picks();return}
  rn.innerHTML=D.races.filter(r=>r.place_name===place).map(r=>`<button class="${r.rno===rno?'on':''} ${done(r)?'done':''}" onclick="setR(${r.rno})">${r.rno}R</button>`).join('');
  const r=D.races.find(x=>x.place_name===place&&x.rno===rno);
  document.getElementById('main').innerHTML=warn()+race(r);
}
function warn(){return `<div class="warn">指数は<b>暫定・未検証</b>です（近4走の着差をレースの格で補正しただけ）。過去2年分の回収率検証が終わるまでは、買い目の根拠にしないでください。★＝指数3位以内なのに6番人気以下。</div>`}
function race(r){
  const g=r.surface==='障'?'障害':(r.surface||'');
  const going=r.going_turf||r.going_dirt||'';
  const rows=r.runners.map(h=>{
    const ic=h.ps_rank===1?'top1':(h.ps_rank&&h.ps_rank<=3?'top3':'');
    return `<tr class="${h.gap?'gap':''}"><td class="num"><span class="w" style="background:${WC[h.waku]||'#444'};color:${WT[h.waku]||'#fff'}">${h.num}</span></td>
    <td><div class="nm">${h.gap?'<span class="star">★</span>':''}${h.horse}</div><div class="jk">${h.jockey}　${h.sexage||''} ${h.kg||''}　${h.last.join(' ')}</div></td>
    <td class="r">${h.odds??'-'}<div class="pop">${h.pop?h.pop+'人気':''}</div></td>
    <td class="r">${h.mkt_p!=null?(h.mkt_p*100).toFixed(1)+'%':'-'}<div class="bar" style="width:${Math.min(100,(h.mkt_p||0)*250)}%"></div></td>
    <td class="r"><span class="idx ${ic}">${h.ps_idx??'—'}</span><div class="pop">${h.ps_rank?h.ps_rank+'位':''}</div></td></tr>`}).join('');
  return `<div class="card"><div class="rh"><div class="rt">${r.place_name}${r.rno}R ${r.race_name}${r.grade?`<span class="gr">${r.grade}</span>`:''}</div><div class="time">${r.post_time||''}</div></div>
  <div class="meta">${g}${r.distance||''}m ${r.course_detail||''}　${r.weather||''} ${going}${done(r)?'　<b>発走済み</b>':''}</div>
  <table><tr><th></th><th>馬名／騎手・近走</th><th class="r">単勝</th><th class="r">市場勝率</th><th class="r">指数</th></tr>${rows}</table>
  ${r.no_past?`<div class="lg">過去走のない馬（${r.no_past}頭）は指数なし。新馬戦は指数を出していません。</div>`:''}</div>`;
}
function picks(){
  const xs=[];D.races.forEach(r=>r.runners.forEach(h=>{if(h.gap)xs.push({r,h})}));
  const up=xs.filter(x=>!done(x.r)),past=xs.filter(x=>done(x.r));
  const li=a=>a.map(({r,h})=>`<div class="pick" onclick="go('${r.place_name}',${r.rno})"><div><b>${r.place_name}${r.rno}R</b> ${r.post_time}　<span class="star">★</span>${h.num} ${h.horse}<div class="jk">${r.race_name}　指数${h.ps_rank}位</div></div><div class="r">${h.odds}<div class="pop">${h.pop}人気</div></div></div>`).join('')||'<div class="jk">なし</div>';
  return warn()+`<div class="card"><div class="rt">これから発走（${up.length}）</div>${li(up)}</div><div class="card"><div class="rt" style="color:var(--mut)">発走済み（${past.length}）</div>${li(past)}</div>`;
}
function setP(p){place=p;try{localStorage.setItem('kp',p)}catch(e){};if(p!=='注目'){const nx=D.races.find(r=>r.place_name===p&&!done(r));rno=nx?nx.rno:1}render();scrollTo(0,0)}
function setR(n){rno=n;render();scrollTo(0,0)}
function go(p,n){place=p;rno=n;render();scrollTo(0,0)}
init();
</script></body></html>
