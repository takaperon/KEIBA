}
function render(){
  document.getElementById('tabs').innerHTML=['注目',...places].map(p=>`<button class="tab ${p===place?'on':''}" onclick="setP('${p}')">${p}</button>`).join('');
  const rn=document.getElementById('rn');
  if(place==='注目'){rn.innerHTML='';document.getElementById('main').innerHTML=picks();return}
  rn.innerHTML=D.races.filter(r=>r.place_name===place).map(r=>`<button class="${r.rno===rno?'on':''} ${done(r)?'done':''}" onclick="setR(${r.rno})">${r.rno}R</button>`).join('');
  const r=D.races.find(x=>x.place_name===place&&x.rno===rno);
  document.getElementById('main').innerHTML=warn()+race(r);
}
function warn(){return `<div class="warn">指数は<b>暫定・未検証</b>です（近4走の着差をレースの格で補正しただけ）。過去2年分の回収率検証が終わるまでは、買い目の根拠にしないでください。★＝指数3位以内なのに6番人気以下。</div>`}
function race(r){
  const g=r.surface==='障'?'障害':(r.surface||'');
  const going=r.going_turf||r.going_dirt||'';
  const rows=r.runners.map(h=>{
    const ic=h.ps_rank===1?'top1':(h.ps_rank&&h.ps_rank<=3?'top3':'');
    return `<tr class="${h.gap?'gap':''}"><td class="num"><span class="w" style="background:${WC[h.waku]||'#444'};color:${WT[h.waku]||'#fff'}">${h.num}</span></td>
    <td><div class="nm">${h.gap?'<span class="star">★</span>':''}${h.horse}</div><div class="jk">${h.jockey}　${h.sexage||''} ${h.kg||''}　${h.last.join(' ')}</div></td>
    <td class="r">${h.odds??'-'}<div class="pop">${h.pop?h.pop+'人気':''}</div></td>
    <td class="r">${h.mkt_p!=null?(h.mkt_p*100).toFixed(1)+'%':'-'}<div class="bar" style="width:${Math.min(100,(h.mkt_p||0)*250)}%"></div></td>
    <td class="r"><span class="idx ${ic}">${h.ps_idx??'—'}</span><div class="pop">${h.ps_rank?h.ps_rank+'位':''}</div></td></tr>`}).join('');
  return `<div class="card"><div class="rh"><div class="rt">${r.place_name}${r.rno}R ${r.race_name}${r.grade?`<span class="gr">${r.grade}</span>`:''}</div><div class="time">${r.post_time||''}</div></div>
  <div class="meta">${g}${r.distance||''}m ${r.course_detail||''}　${r.weather||''} ${going}${done(r)?'　<b>発走済み</b>':''}</div>
  <table><tr><th></th><th>馬名／騎手・近走</th><th class="r">単勝</th><th class="r">市場勝率</th><th class="r">指数</th></tr>${rows}</table>
  ${r.no_past?`<div class="lg">過去走のない馬（${r.no_past}頭）は指数なし。新馬戦は指数を出していません。</div>`:''}</div>`;
}
function picks(){
  const xs=[];D.races.forEach(r=>r.runners.forEach(h=>{if(h.gap)xs.push({r,h})}));
  const up=xs.filter(x=>!done(x.r)),past=xs.filter(x=>done(x.r));
  const li=a=>a.map(({r,h})=>`<div class="pick" onclick="go('${r.place_name}',${r.rno})"><div><b>${r.place_name}${r.rno}R</b> ${r.post_time}　<span class="star">★</span>${h.num} ${h.horse}<div class="jk">${r.race_name}　指数${h.ps_rank}位</div></div><div class="r">${h.odds}<div class="pop">${h.pop}人気</div></div></div>`).join('')||'<div class="jk">なし</div>';
  return warn()+`<div class="card"><div class="rt">これから発走（${up.length}）</div>${li(up)}</div><div class="card"><div class="rt" style="color:var(--mut)">発走済み（${past.length}）</div>${li(past)}</div>`;
}
function setP(p){place=p;try{localStorage.setItem('kp',p)}catch(e){};if(p!=='注目'){const nx=D.races.find(r=>r.place_name===p&&!done(r));rno=nx?nx.rno:1}render();scrollTo(0,0)}
function setR(n){rno=n;render();scrollTo(0,0)}
function go(p,n){place=p;rno=n;render();scrollTo(0,0)}
init();
</script></body></html>
